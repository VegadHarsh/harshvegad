<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/HR.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Web site created using create-react-app" />
  <link rel="stylesheet" href="css/owl.carousel.min.css" type="text/css">
  <!-- <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" /> -->
  <!-- {
    "src": "logo192.png",
    "type": "image/png",
    "sizes": "192x192"
  }, -->
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>HR Vegad</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Assign jQuery to global variables -->
  <script>
    window.$ = window.jQuery = $;
  </script>

  <!-- Include Owl Carousel JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>

  <!-- Initialize Owl Carousel -->
  <script>
    $(document).ready(function () {
      var $slider = $(".hero__slider");

      // Check if the slider exists before initializing Owl Carousel
      if ($slider.length) {
        var owl = $slider.owlCarousel({
          loop: true,
          items: 1,
          autoplay: true,
          autoplayTimeout: 2000,
          autoplayHoverPause: true,
          animateOut: "fadeOut",
          animateIn: "fadeIn",
          mouseDrag: false,
          touchDrag: false,
          pullDrag: false,
          dots: true,
          nav: false,
        });

        // Customize dot numbers after Owl Carousel is initialized
        owl.on("initialized.owl.carousel changed.owl.carousel", function () {
          setTimeout(function () {
            $(".hero__slider .owl-dot").each(function (index) {
              var dotIndex = index + 1;
              $(this).html(dotIndex < 10 ? "0" + dotIndex : dotIndex);
            });
          }, 100); // Small delay to wait for dots to render
        });
      } else {
        console.warn("Owl Carousel: .hero__slider not found.");
      }
    });

  </script>
  <!-- Add these inside <head> -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>

</body>

</html>
